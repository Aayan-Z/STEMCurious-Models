<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Circle — Sine and Cosine</title>
<style>
:root{--bg:#000;--panel:rgba(28,28,30,.72);--line:rgba(255,255,255,.14);--text:#d8d8dc;--muted:#92929a;--blue:#4da3ff;--red:#ff5b62;--white:#f4f4f5}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:"Times New Roman",Times,serif;min-height:100vh}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;min-height:100vh;padding:18px}.panel{background:linear-gradient(145deg,rgba(45,45,48,.8),rgba(16,16,18,.72));border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);overflow:auto}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:28px;font-weight:normal;margin:8px 0 24px;color:#cfcfd4}.group{margin:22px 0}.label{display:flex;justify-content:space-between;gap:12px;font-size:16px;margin-bottom:9px}.value{color:#b9b9c0}.row{display:flex;gap:8px;align-items:center}.control{width:100%;background:#09090a;color:#d0d0d5;border:1px solid #414146;border-radius:10px;padding:9px;font:16px "Times New Roman",Times,serif}input[type=range]{width:100%;accent-color:#aaa;cursor:pointer}button{background:#171719;color:#cfcfd4;border:1px solid #4a4a50;border-radius:10px;padding:10px 12px;font:16px "Times New Roman",Times,serif;cursor:pointer}button:hover{background:#252529}.readout{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.metric{display:flex;justify-content:space-between;margin:10px 0;font-size:17px}.metric span:last-child{font-variant-numeric:tabular-nums}.blue{color:var(--blue)}.red{color:var(--red)}.white{color:var(--white)}.stage{position:relative;min-width:0;min-height:620px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}canvas{display:block;width:100%;height:100%;min-height:620px}.hint{color:var(--muted);font-size:14px;line-height:1.45;margin-top:20px}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}.panel{order:2}.stage{order:1;min-height:460px}canvas{min-height:460px}}
</style></head><body><main><aside class="panel"><div class="eyebrow">Trigonometry / Geometry</div><h1>Unit Circle</h1><div class="group"><div class="label"><label for="angle">Angle θ</label><span class="value" id="angleValue">0°</span></div><input id="angle" type="range" min="0" max="360" step="0.1" value="0"><div class="row" style="margin-top:10px"><input id="angleInput" class="control" type="number" min="0" max="360" step="0.1" value="0" aria-label="Numerical angle in degrees"><button id="apply">Set</button></div></div><div class="row"><button id="toggle">Pause</button><button id="reset">Reset</button></div><div class="readout"><div class="metric"><span>Radius</span><span class="white">1 unit</span></div><div class="metric"><span>cos θ</span><span class="red" id="cosRead">1.0000</span></div><div class="metric"><span>sin θ</span><span class="blue" id="sinRead">0.0000</span></div></div><p class="hint">Positive angles rotate anticlockwise. The red projection is cos θ; the blue projection is sin θ. The animation pauses when you edit the angle or press Pause.</p></aside><section class="stage"><canvas id="canvas" aria-label="Animated unit circle showing sine and cosine projections"></canvas></section></main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const angle=document.getElementById('angle'),angleInput=document.getElementById('angleInput'),angleValue=document.getElementById('angleValue'),cosRead=document.getElementById('cosRead'),sinRead=document.getElementById('sinRead'),toggle=document.getElementById('toggle');let theta=0,playing=true,last=0,manual=false;
function resize(){const d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
function setAngle(v,pause=true){theta=((Number(v)%360)+360)%360;angle.value=theta;angleInput.value=theta.toFixed(1).replace(/\.0$/,'');if(pause){playing=false;toggle.textContent='Resume'}updateReadouts()}
function updateReadouts(){const r=theta*Math.PI/180;angleValue.textContent=theta.toFixed(1).replace(/\.0$/,'')+'°';cosRead.textContent=Math.cos(r).toFixed(4);sinRead.textContent=Math.sin(r).toFixed(4)}
function text(t,x,y,size,color,align='center'){ctx.fillStyle=color;ctx.font=size+'px "Times New Roman", Times, serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const cx=w*.53,cy=h*.52,R=Math.min(w*.34,h*.37);const a=theta*Math.PI/180,px=cx+R*Math.cos(a),py=cy-R*Math.sin(a);ctx.lineWidth=2;ctx.strokeStyle='#eee';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(220,220,220,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-R-35,cy);ctx.lineTo(cx+R+35,cy);ctx.moveTo(cx,cy-R-35);ctx.lineTo(cx,cy+R+35);ctx.stroke();text('x',cx+R+45,cy+17,18,'#aaa');text('y',cx+15,cy-R-42,18,'#aaa');ctx.strokeStyle='#f4f4f5';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle='#f4f4f5';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff5b62';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,cy);ctx.stroke();ctx.strokeStyle='#4da3ff';ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,cy);ctx.stroke();ctx.setLineDash([]);text('1',cx+R/2,cy+25,18,'#ff5b62');text('1',cx-18,cy-R/2,18,'#4da3ff');text('θ',cx+R*.22*Math.cos(a/2),cy-R*.22*Math.sin(a/2),23,'#f4f4f5');text('θ = '+theta.toFixed(1).replace(/\.0$/,'')+'°',cx,cy+R+48,21,'#cfcfd4');text('cos θ = '+Math.cos(a).toFixed(4),cx+(px-cx)/2,cy+24,17,'#ff5b62');text('sin θ = '+Math.sin(a).toFixed(4),px+42,cy+(py-cy)/2,17,'#4da3ff','left');text('P',px+12,py-14,18,'#f4f4f5','left')}
function frame(t){if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;if(playing&&!manual){theta+=dt*45;if(theta>=360)theta-=360;angle.value=theta;angleInput.value=theta.toFixed(1);updateReadouts()}draw();requestAnimationFrame(frame)}
angle.addEventListener('input',e=>{manual=true;setAngle(e.target.value,true)});angleInput.addEventListener('keydown',e=>{if(e.key==='Enter'){manual=true;setAngle(e.target.value,true)}});document.getElementById('apply').addEventListener('click',()=>{manual=true;setAngle(angleInput.value,true)});toggle.addEventListener('click',()=>{playing=!playing;manual=false;toggle.textContent=playing?'Pause':'Resume';last=0});document.getElementById('reset').addEventListener('click',()=>{manual=false;setAngle(0,false);playing=true;toggle.textContent='Pause';last=0});window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
