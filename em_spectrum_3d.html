<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electromagnetic Spectrum Explorer</title>
<style>
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; color:#fff;
    font-family:'Times New Roman', Times, serif; overflow:hidden; }
  #canvas-wrap{ position:fixed; inset:0; background:#000; }
  canvas{ display:block; }

  #panel{
    position:fixed; top:16px; left:16px; bottom:16px; width:245px;
    background:rgba(255,255,255,0.09);
    -webkit-backdrop-filter: blur(34px) saturate(180%);
    backdrop-filter: blur(34px) saturate(180%);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:28px;
    padding:20px 0; overflow-y:auto; z-index:6;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(255,255,255,0.05);
  }
  #panel::-webkit-scrollbar{ width:5px; }
  #panel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.25); border-radius:3px; }
  .shell-label{ font-size:13px; color:rgba(255,255,255,0.55); margin:0 22px 10px 22px; font-style:italic; }
  .orb-list{ display:flex; flex-direction:column; padding:0 12px; gap:5px; }
  .orb-btn{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#fff; text-align:left;
    font-family:'Times New Roman', Times, serif; font-size:16px; padding:12px 15px;
    border-radius:16px; cursor:pointer; transition: background .18s ease, transform .18s ease;
    display:flex; align-items:center; gap:10px;
  }
  .orb-btn .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor; }
  .orb-btn:hover{ background:rgba(255,255,255,0.13); transform:translateX(2px); }
  .orb-btn.active{ background:rgba(255,255,255,0.22); font-weight:700; }

  #hint{ position:fixed; top:24px; right:28px; font-size:14px; color:#fff; text-align:right;
    line-height:1.9; z-index:6; pointer-events:none; font-family:'Times New Roman', Times, serif;
    text-shadow:0 1px 6px rgba(0,0,0,0.6); }

  /* ---------- Liquid-glass bubble modal ---------- */
  #overlay{
    position:fixed; inset:0; z-index:10;
    background:rgba(0,0,0,0.35);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .35s cubic-bezier(.22,1,.36,1);
  }
  #overlay.show{ opacity:1; pointer-events:auto; }

  #bubble{
    position:relative;
    width:480px; max-width:90vw; max-height:82vh; overflow-y:auto;
    background:rgba(255,255,255,0.10);
    -webkit-backdrop-filter: blur(46px) saturate(200%);
    backdrop-filter: blur(46px) saturate(200%);
    border:1px solid rgba(255,255,255,0.32);
    border-radius:32px;
    padding:34px 36px 30px 36px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(255,255,255,0.06);
    transform:scale(0.88); transition: transform .35s cubic-bezier(.22,1,.36,1);
  }
  #overlay.show #bubble{ transform:scale(1); }
  #bubble::before{
    content:""; position:absolute; inset:0; border-radius:32px; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.04) 22%, rgba(255,255,255,0) 55%);
  }
  #bubble::-webkit-scrollbar{ width:5px; }
  #bubble::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.25); border-radius:3px; }

  #closeBtn{
    position:absolute; top:20px; right:20px; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-size:16px; cursor:pointer; z-index:2;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease;
  }
  #closeBtn:hover{ background:rgba(255,255,255,0.26); }

  #swatch{ width:100%; height:14px; border-radius:8px; margin-bottom:18px; position:relative; z-index:1; }
  #bubbleName{ font-size:30px; color:rgba(255,255,255,0.94); margin:0 0 4px 0; position:relative; z-index:1; }
  #bubbleTag{ font-size:13.5px; color:rgba(255,255,255,0.5); margin-bottom:18px; position:relative; z-index:1; font-style:italic; }

  .stat-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.12); position:relative; z-index:1; }
  .stat-row span:first-child{ color:rgba(255,255,255,0.55); font-size:13.5px; }
  .stat-row span:last-child{ color:rgba(255,255,255,0.9); font-size:14px; text-align:right; max-width:65%; }

  #bubbleDesc{ font-size:14.5px; line-height:1.6; color:rgba(255,255,255,0.72); margin:18px 0 14px 0; position:relative; z-index:1; }

  #usesLabel{ font-size:13px; color:rgba(255,255,255,0.5); font-style:italic; margin-bottom:8px; position:relative; z-index:1; }
  #usesList{ margin:0; padding-left:20px; position:relative; z-index:1; }
  #usesList li{ font-size:14px; line-height:1.7; color:rgba(255,255,255,0.78); }

  @media (max-width: 820px){
    #panel{ width:190px; } #hint{ display:none; }
    #bubble{ padding:26px 22px 24px 22px; }
    #bubbleName{ font-size:24px; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="panel">
  <div class="shell-label">The Electromagnetic Spectrum</div>
  <div class="orb-list" id="bandList"></div>
</div>

<div id="hint">
  Drag to rotate<br>
  Scroll to zoom<br>
  Click a band for details
</div>

<div id="overlay">
  <div id="bubble">
    <button id="closeBtn">&times;</button>
    <div id="swatch"></div>
    <div id="bubbleName">Radio Waves</div>
    <div id="bubbleTag">Lowest frequency, longest wavelength</div>
    <div class="stat-row"><span>Wavelength</span><span id="statWl"></span></div>
    <div class="stat-row"><span>Frequency</span><span id="statFreq"></span></div>
    <div class="stat-row"><span>Speed in vacuum</span><span id="statSpeed">299,792,458 m/s (c)</span></div>
    <div id="bubbleDesc"></div>
    <div id="usesLabel">Real-world uses</div>
    <ul id="usesList"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   DATA: standard textbook EM-spectrum boundaries. All bands
   travel at the same speed in vacuum, c = 299,792,458 m/s;
   only wavelength and frequency differ (c = wavelength * frequency).
   Colors beyond the visible band are illustrative false-color
   conventions, not the bands' literal appearance.
   ============================================================ */

var BANDS = [
  { key:"radio", name:"Radio Waves", tag:"Lowest frequency, longest wavelength", color:0x9c3b3b,
    wl:"Greater than 10 cm (up to kilometers)", freq:"Below 3 GHz",
    desc:"The lowest-energy, longest-wavelength part of the spectrum. Produced by oscillating electric currents in an antenna, radio waves can diffract around hills and buildings and travel enormous distances with little absorption.",
    uses:["AM/FM radio and television broadcasting","Wi-Fi and mobile phone signals","Radar and air-traffic control","GPS satellite navigation","Radio astronomy"] },

  { key:"microwave", name:"Microwaves", tag:"Short radio waves", color:0xd2691e,
    wl:"1 mm \u2013 10 cm", freq:"3 GHz \u2013 300 GHz",
    desc:"Short enough to be focused into narrow beams with a small dish or horn antenna. Readily absorbed by water molecules, which is exactly how a microwave oven heats food from the inside.",
    uses:["Microwave ovens","Satellite and point-to-point communication","Wi-Fi (2.4 / 5 GHz) and Bluetooth","Weather and speed radar","Mapping the Cosmic Microwave Background"] },

  { key:"infrared", name:"Infrared", tag:"Heat radiation", color:0xff4500,
    wl:"700 nm \u2013 1 mm", freq:"300 GHz \u2013 430 THz",
    desc:"Emitted by every object with a temperature above absolute zero \u2014 the warmer the object, the more infrared it radiates. This is why thermal cameras can \u201csee\u201d body heat in complete darkness.",
    uses:["Thermal imaging and night vision","TV and AC remote controls","Fiber-optic data transmission","Infrared heat lamps and saunas","Weather satellite cloud imaging"] },

  { key:"visible", name:"Visible Light", tag:"The narrow band human eyes detect", color:0x35c46a, isRainbow:true,
    wl:"400 \u2013 700 nm", freq:"430 \u2013 750 THz",
    desc:"An almost impossibly thin sliver of the full spectrum, yet the only part human eyes evolved to see. Each color is a different wavelength: red (~700 nm) has the longest wavelength we can see, violet (~400 nm) the shortest.",
    uses:["Human and animal vision","Photography and displays","Photosynthesis in plants","Lasers and optical instruments","Fiber-optic and free-space communication"] },

  { key:"ultraviolet", name:"Ultraviolet", tag:"Beyond violet", color:0x8a2be2,
    wl:"10 \u2013 400 nm", freq:"750 THz \u2013 30 PHz",
    desc:"Energetic enough to break chemical bonds and damage DNA \u2014 the direct cause of sunburn and a skin-cancer risk. Earth's ozone layer absorbs most, but not all, of the Sun's ultraviolet output.",
    uses:["Sterilizing water, air, and surfaces","Vitamin D production in skin","Black lights and forged-banknote detection","Curing inks, adhesives, and resins","Studying hot young stars in astronomy"] },

  { key:"xray", name:"X-rays", tag:"Penetrates soft tissue", color:0x4a90e2,
    wl:"0.01 \u2013 10 nm", freq:"30 PHz \u2013 30 EHz",
    desc:"Passes through soft tissue but is absorbed by denser material like bone or metal, which is exactly what makes it so useful for imaging. High doses are damaging, so exposure is carefully limited and shielded.",
    uses:["Medical and dental imaging","Airport baggage and body scanners","Crystallography (determining molecular structure)","Industrial inspection of welds and castings","Observing black holes and neutron stars"] },

  { key:"gamma", name:"Gamma Rays", tag:"The most energetic light known", color:0xf2eaff,
    wl:"Less than 0.01 nm", freq:"Above 30 EHz",
    desc:"The most energetic photons in the universe, produced by nuclear reactions, radioactive decay, and the most violent events in the cosmos, such as supernovae and neutron-star mergers.",
    uses:["Cancer radiotherapy","Sterilizing medical equipment","PET scans in nuclear medicine","Detecting radioactive material","Observing gamma-ray bursts in astrophysics"] }
];

var byKey = {}; BANDS.forEach(function(b){ byKey[b.key]=b; });

/* ============================================================
   SCENE SETUP
   ============================================================ */

var wrap = document.getElementById('canvas-wrap');
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 400);
camera.position.set(0, 4.5, 15);

var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
wrap.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.minDistance = 2;
controls.maxDistance = 60;
controls.target.set(0,0,0);

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
var keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
keyLight.position.set(6,10,8);
scene.add(keyLight);
var fillLight = new THREE.DirectionalLight(0xaeccff, 0.3);
fillLight.position.set(-6,-3,-5);
scene.add(fillLight);

/* ---------- rainbow texture for the visible-light segment ---------- */

function makeRainbowTexture(){
  var w=256,h=32, c=document.createElement('canvas'); c.width=w; c.height=h;
  var ctx=c.getContext('2d');
  var g=ctx.createLinearGradient(0,0,w,0);
  g.addColorStop(0.00,'#8b00ff'); g.addColorStop(0.18,'#3b3bff'); g.addColorStop(0.36,'#22c2e8');
  g.addColorStop(0.52,'#35c46a'); g.addColorStop(0.68,'#f0e030'); g.addColorStop(0.84,'#ff8c1a');
  g.addColorStop(1.00,'#ff2b2b');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  return new THREE.CanvasTexture(c);
}
var rainbowTex = makeRainbowTexture();

/* ---------- text sprite helper ---------- */

function makeLabel(text, scale){
  var size=512, canvas=document.createElement('canvas');
  canvas.width=size; canvas.height=size*0.28;
  var ctx=canvas.getContext('2d');
  ctx.font='400 58px "Times New Roman", Times, serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=7; ctx.strokeStyle='rgba(0,0,0,0.85)';
  ctx.strokeText(text, size/2, size*0.14);
  ctx.fillStyle='#ffffff';
  ctx.fillText(text, size/2, size*0.14);
  var tex=new THREE.CanvasTexture(canvas);
  var mat=new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  var sprite=new THREE.Sprite(mat);
  sprite.scale.set(scale*3.6, scale, 1);
  return sprite;
}

/* ============================================================
   BUILD SPECTRUM BAR
   ============================================================ */

var SEG_W = 2.0, SEG_H = 1.4, SEG_D = 1.4, GAP=0.12;
var totalW = BANDS.length*(SEG_W+GAP) - GAP;
var startX = -totalW/2 + SEG_W/2;

var segMeshes = {};
var pickable = [];

BANDS.forEach(function(b, i){
  var x = startX + i*(SEG_W+GAP);
  var geo = new THREE.BoxGeometry(SEG_W, SEG_H, SEG_D);
  var mat;
  if(b.isRainbow){
    mat = new THREE.MeshStandardMaterial({ map:rainbowTex, metalness:0.35, roughness:0.4 });
  } else {
    mat = new THREE.MeshStandardMaterial({ color:b.color, metalness:0.4, roughness:0.42,
      emissive:new THREE.Color(b.color).multiplyScalar(0.22) });
  }
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x,0,0);
  mesh.userData.key = b.key;
  mesh.userData.baseY = 0;
  scene.add(mesh);
  segMeshes[b.key] = mesh;
  pickable.push(mesh);

  var label = makeLabel(b.name, 0.55);
  label.position.set(x, SEG_H/2+0.55, 0);
  scene.add(label);
});

/* ============================================================
   UI: band list, bubble modal, picking, hover animation
   ============================================================ */

var buttons = {};
function setActiveButton(key){
  Object.keys(buttons).forEach(function(k){ buttons[k].classList.toggle('active', k===key); });
}

function buildButtons(){
  var container = document.getElementById('bandList');
  BANDS.forEach(function(b){
    var btn=document.createElement('button');
    btn.className='orb-btn';
    var dot=document.createElement('span');
    dot.className='dot';
    var hex = '#'+b.color.toString(16).padStart(6,'0');
    dot.style.background = b.isRainbow ? 'linear-gradient(90deg,#8b00ff,#ff2b2b)' : hex;
    dot.style.color = hex;
    var txt=document.createElement('span');
    txt.textContent=b.name;
    btn.appendChild(dot); btn.appendChild(txt);
    btn.addEventListener('click', function(){ openBubble(b.key); });
    container.appendChild(btn);
    buttons[b.key]=btn;
  });
}

function openBubble(key){
  var b = byKey[key];
  if(!b) return;
  var hex = '#'+b.color.toString(16).padStart(6,'0');
  document.getElementById('swatch').style.background = b.isRainbow
    ? 'linear-gradient(90deg,#8b00ff,#3b3bff,#22c2e8,#35c46a,#f0e030,#ff8c1a,#ff2b2b)'
    : hex;
  document.getElementById('bubbleName').textContent = b.name;
  document.getElementById('bubbleTag').textContent = b.tag;
  document.getElementById('statWl').textContent = b.wl;
  document.getElementById('statFreq').textContent = b.freq;
  document.getElementById('bubbleDesc').textContent = b.desc;
  var list = document.getElementById('usesList');
  list.innerHTML = '';
  b.uses.forEach(function(u){ var li=document.createElement('li'); li.textContent=u; list.appendChild(li); });

  document.getElementById('overlay').classList.add('show');
  setActiveButton(key);

  var mesh = segMeshes[key];
  flyTo(new THREE.Vector3(mesh.position.x, 2.6, 6.5), new THREE.Vector3(mesh.position.x,0,0));
}

document.getElementById('closeBtn').addEventListener('click', function(){
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target.id==='overlay') document.getElementById('overlay').classList.remove('show');
});

buildButtons();

/* ---------- picking (hover glow + click) ---------- */

var raycaster = new THREE.Raycaster();
var mouseNdc = new THREE.Vector2();
var hoveredKey = null;

renderer.domElement.addEventListener('pointermove', function(e){
  var rect = renderer.domElement.getBoundingClientRect();
  mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseNdc, camera);
  var hits = raycaster.intersectObjects(pickable);
  var newHover = hits.length>0 ? hits[0].object.userData.key : null;
  if(newHover!==hoveredKey){
    hoveredKey = newHover;
    renderer.domElement.style.cursor = newHover ? 'pointer' : 'default';
  }
});

var downPos=null;
renderer.domElement.addEventListener('pointerdown', function(e){ downPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', function(e){
  if(!downPos) return;
  var dx=e.clientX-downPos.x, dy=e.clientY-downPos.y;
  downPos=null;
  if(Math.sqrt(dx*dx+dy*dy) > 6) return;
  var rect = renderer.domElement.getBoundingClientRect();
  mouseNdc.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouseNdc.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouseNdc, camera);
  var hits = raycaster.intersectObjects(pickable);
  if(hits.length>0) openBubble(hits[0].object.userData.key);
});

/* ============================================================
   CAMERA FLY-TO + RENDER LOOP
   ============================================================ */

var flying=false, flyT=0, FLY_DUR=1.0;
var flyStart={cam:new THREE.Vector3(),tgt:new THREE.Vector3()};
var flyEnd={cam:new THREE.Vector3(),tgt:new THREE.Vector3()};

function flyTo(camPos, targetPos){
  flyStart.cam.copy(camera.position); flyStart.tgt.copy(controls.target);
  flyEnd.cam.copy(camPos); flyEnd.tgt.copy(targetPos);
  flyT=0; flying=true;
}
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function animate(now){
  requestAnimationFrame(animate);

  BANDS.forEach(function(b){
    var mesh = segMeshes[b.key];
    var targetY = (hoveredKey===b.key) ? 0.28 : 0;
    mesh.position.y += (targetY-mesh.position.y)*0.18;
  });

  if(flying){
    flyT += 1/60/FLY_DUR;
    if(flyT>=1){ flyT=1; flying=false; }
    var e=easeInOut(flyT);
    camera.position.lerpVectors(flyStart.cam, flyEnd.cam, e);
    controls.target.lerpVectors(flyStart.tgt, flyEnd.tgt, e);
  }

  controls.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

})();
</script>
</body>
</html>
